<svg xmlns="http://www.w3.org/2000/svg" width="512" height="768" viewBox="0 0 512 768" color="#95b6d2"><defs><linearGradient id="metal" x2=".8" y2="1"><stop stop-color="#fff0c9"/><stop offset=".22" stop-color="currentColor"/><stop offset=".5" stop-color="#866750"/><stop offset=".7" stop-color="currentColor"/><stop offset="1" stop-color="#493b43"/></linearGradient><linearGradient id="paper" x2=".7" y2="1"><stop stop-color="#f0e2c5"/><stop offset="1" stop-color="#c9b58f"/></linearGradient><linearGradient id="night" x2=".8" y2="1"><stop stop-color="#4b3f58"/><stop offset="1" stop-color="#2b2b33"/></linearGradient><radialGradient id="ruby"><stop stop-color="#ee9a86"/><stop offset=".35" stop-color="#c64b5c"/><stop offset="1" stop-color="#65293c"/></radialGradient></defs><rect width="512" height="768" fill="#342f3d"/><rect x="14" y="14" width="484" height="740" rx="18" fill="url(#paper)" stroke="url(#metal)" stroke-width="7"/>
  <text x="256" y="62" text-anchor="middle" fill="#7c5c4c" font-family="Verdana,sans-serif" font-size="11" font-weight="normal"><tspan x="256" dy="0">THE MIDNIGHT COLLECTION</tspan></text><text x="256" y="121" text-anchor="middle" fill="#493946" font-family="Verdana,sans-serif" font-size="30" font-weight="bold"><tspan x="256" dy="0">Field notes</tspan></text><text x="256" y="164" text-anchor="middle" fill="#785a50" font-family="Verdana,sans-serif" font-size="16" font-weight="normal"><tspan x="256" dy="0">The Werehound Twins</tspan></text>
  <path d="M61 194h390" stroke="#a17c58"/><text x="256" y="252" text-anchor="middle" fill="#4b3f46" font-family="Verdana,sans-serif" font-size="18" font-weight="normal"><tspan x="256" dy="0">The long brown dog meets the small</tspan><tspan x="256" dy="28">grey dog again.</tspan></text><text x="256" y="340" text-anchor="middle" fill="#4b3f46" font-family="Verdana,sans-serif" font-size="18" font-weight="normal"><tspan x="256" dy="0">Long becomes longer; cute becomes</tspan><tspan x="256" dy="28">cuter.</tspan></text><text x="256" y="428" text-anchor="middle" fill="#4b3f46" font-family="Verdana,sans-serif" font-size="18" font-weight="normal"><tspan x="256" dy="0">Our two werehounds are as friendly</tspan><tspan x="256" dy="28">as each other.</tspan></text>
  <path d="M61 574h390" stroke="#a17c58"/><text x="256" y="616" text-anchor="middle" fill="#785a50" font-family="Verdana,sans-serif" font-size="16" font-weight="normal"><tspan x="256" dy="0">Use than for differences; as … as for</tspan><tspan x="256" dy="25">equality.</tspan></text>
  <g transform="translate(256 698) scale(.45)"><ellipse cx="-12" cy="-9" rx="28" ry="11" fill="#bb8353"/><ellipse cx="21" cy="-14" rx="13" ry="15" fill="#bb8353"/><path d="m12-22-8 4 4 17 8-4M-29 0v14m28-14v14" stroke="#694d3c" stroke-width="7"/><ellipse cx="7" cy="25" rx="20" ry="12" fill="#99968e"/><circle cx="26" cy="20" r="13" fill="#aaa69b"/><path d="m19 8-9 5 3 14m20-16 10 11" stroke="#625e5c" stroke-width="6"/><circle cx="25" cy="-17" r="2" fill="#302b38"/><circle cx="31" cy="18" r="2" fill="#302b38"/><path d="m-3-8 7 8-7 8-7-8Z" fill="#df9b4a"/></g>
  <text x="256" y="738" text-anchor="middle" fill="#7c5c4c" font-family="Verdana,sans-serif" font-size="9" font-weight="normal"><tspan x="256" dy="0">L E R N D O R F   ·   E N G L I S H</tspan></text></svg>