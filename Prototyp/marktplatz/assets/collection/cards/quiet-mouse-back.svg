<svg xmlns="http://www.w3.org/2000/svg" width="512" height="768" viewBox="0 0 512 768" color="#95b6d2"><defs><linearGradient id="metal" x2=".8" y2="1"><stop stop-color="#fff0c9"/><stop offset=".22" stop-color="currentColor"/><stop offset=".5" stop-color="#866750"/><stop offset=".7" stop-color="currentColor"/><stop offset="1" stop-color="#493b43"/></linearGradient><linearGradient id="paper" x2=".7" y2="1"><stop stop-color="#f0e2c5"/><stop offset="1" stop-color="#c9b58f"/></linearGradient><linearGradient id="night" x2=".8" y2="1"><stop stop-color="#4b3f58"/><stop offset="1" stop-color="#2b2b33"/></linearGradient><radialGradient id="ruby"><stop stop-color="#ee9a86"/><stop offset=".35" stop-color="#c64b5c"/><stop offset="1" stop-color="#65293c"/></radialGradient></defs><rect width="512" height="768" fill="#342f3d"/><rect x="14" y="14" width="484" height="740" rx="18" fill="url(#paper)" stroke="url(#metal)" stroke-width="7"/>
  <text x="256" y="62" text-anchor="middle" fill="#7c5c4c" font-family="Verdana,sans-serif" font-size="11" font-weight="normal"><tspan x="256" dy="0">THE MIDNIGHT COLLECTION</tspan></text><text x="256" y="121" text-anchor="middle" fill="#493946" font-family="Verdana,sans-serif" font-size="30" font-weight="bold"><tspan x="256" dy="0">Field notes</tspan></text><text x="256" y="164" text-anchor="middle" fill="#785a50" font-family="Verdana,sans-serif" font-size="16" font-weight="normal"><tspan x="256" dy="0">Quiet as a Mouse</tspan></text>
  <path d="M61 194h390" stroke="#a17c58"/><text x="256" y="252" text-anchor="middle" fill="#4b3f46" font-family="Verdana,sans-serif" font-size="18" font-weight="normal"><tspan x="256" dy="0">A simile compares two things.</tspan></text><text x="256" y="312" text-anchor="middle" fill="#4b3f46" font-family="Verdana,sans-serif" font-size="18" font-weight="normal"><tspan x="256" dy="0">As quiet as a mouse means very</tspan><tspan x="256" dy="28">quiet.</tspan></text><text x="256" y="400" text-anchor="middle" fill="#4b3f46" font-family="Verdana,sans-serif" font-size="18" font-weight="normal"><tspan x="256" dy="0">The mouse listens beside the book.</tspan></text>
  <path d="M61 574h390" stroke="#a17c58"/><text x="256" y="616" text-anchor="middle" fill="#785a50" font-family="Verdana,sans-serif" font-size="16" font-weight="normal"><tspan x="256" dy="0">Use as + adjective + as to compare.</tspan></text>
