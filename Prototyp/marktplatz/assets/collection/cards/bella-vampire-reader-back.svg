  <path d="M61 194h390" stroke="#a17c58"/><text x="256" y="252" text-anchor="middle" fill="#4b3f46" font-family="Verdana,sans-serif" font-size="18" font-weight="normal"><tspan x="256" dy="0">Bella keeps her long hair and bright</tspan><tspan x="256" dy="28">braces.</tspan></text><text x="256" y="340" text-anchor="middle" fill="#4b3f46" font-family="Verdana,sans-serif" font-size="18" font-weight="normal"><tspan x="256" dy="0">She is reading: be + verb ending in</tspan><tspan x="256" dy="28">-ing.</tspan></text><text x="256" y="428" text-anchor="middle" fill="#4b3f46" font-family="Verdana,sans-serif" font-size="18" font-weight="normal"><tspan x="256" dy="0">The bats are flying above the</tspan><tspan x="256" dy="28">library.</tspan></text>
