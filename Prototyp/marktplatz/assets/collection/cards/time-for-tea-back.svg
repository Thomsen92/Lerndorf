  <path d="M61 194h390" stroke="#a17c58"/><text x="256" y="252" text-anchor="middle" fill="#4b3f46" font-family="Verdana,sans-serif" font-size="18" font-weight="normal"><tspan x="256" dy="0">At night. In October. On Monday.</tspan></text><text x="256" y="312" text-anchor="middle" fill="#4b3f46" font-family="Verdana,sans-serif" font-size="18" font-weight="normal"><tspan x="256" dy="0">Use on with days.</tspan></text><text x="256" y="372" text-anchor="middle" fill="#4b3f46" font-family="Verdana,sans-serif" font-size="18" font-weight="normal"><tspan x="256" dy="0">We read in the evening.</tspan></text>
