# Push to main: runs the tests. The site itself is built and deployed by Cloudflare Pages (Git integration, SPEC §17).
name: tests

on:
  push:
    branches: [main]
    paths-ignore: ['supabase/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx eslint src tests
      - run: npm test
