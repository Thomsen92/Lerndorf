<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="648" viewBox="0 0 1024 648"><rect width="1024" height="648" fill="#eee0bf"/><rect x="8" y="8" width="1008" height="632" rx="9" fill="none" stroke="#96623e" stroke-width="2"/><text x="40" y="61" font-family="Verdana,sans-serif" font-size="18" font-weight="bold" fill="#80553b">FIELD NOTES AFTER DARK</text><path d="M950 53l-22-11 4 15-12 3 18 3 8-6 8 6 18-3-12-3 4-15Z" fill="#513349"/><text x="40" y="124" font-family="Verdana,sans-serif" font-size="29" font-weight="bold" fill="#46313d">The Midnight Bird</text><path d="M40 151h944" stroke="#ad8d68"/><text x="40" y="212" font-family="Verdana,sans-serif" font-size="23" font-weight="normal" fill="#46313d">The poem is preserved from the supplied textbook image.</text><text x="40" y="267" font-family="Verdana,sans-serif" font-size="23" font-weight="normal" fill="#46313d">The author is not named in this extract.</text><text x="40" y="322" font-family="Verdana,sans-serif" font-size="23" font-weight="normal" fill="#46313d">Listen for floor / door and word / absurd.</text><text x="40" y="377" font-family="Verdana,sans-serif" font-size="23" font-weight="normal" fill="#46313d">Try a whispered reading, then a clear reading.</text><text x="40" y="599" font-family="Verdana,sans-serif" font-size="15" font-weight="normal" fill="#765b55">Original box on the front · Halloween examples added for this prototype</text></svg>