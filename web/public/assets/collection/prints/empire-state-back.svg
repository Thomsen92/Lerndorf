<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="684" viewBox="0 0 1024 684"><rect width="1024" height="684" fill="#eee0bf"/><rect x="8" y="8" width="1008" height="668" rx="9" fill="none" stroke="#96623e" stroke-width="2"/><text x="42" y="58" font-family="Verdana,sans-serif" font-size="17" font-weight="bold" fill="#80553b">A POSTCARD AFTER DARK</text><text x="42" y="108" font-family="Verdana,sans-serif" font-size="26" font-weight="bold" fill="#46313d">Greetings from New York</text><path d="M590 145v444" stroke="#a5886c" stroke-width="2"/><text x="42" y="196" font-family="Verdana,sans-serif" font-size="20" font-weight="normal" fill="#46313d">Dear night reader,</text><text x="42" y="238" font-family="Verdana,sans-serif" font-size="20" font-weight="normal" fill="#46313d">The lights are brighter than the stars.</text><text x="42" y="280" font-family="Verdana,sans-serif" font-size="20" font-weight="normal" fill="#46313d">Happy Halloween from New York!</text><text x="42" y="322" font-family="Verdana,sans-serif" font-size="20" font-weight="normal" fill="#46313d">Your midnight traveller.</text><rect x="860" y="48" width="108" height="129" fill="none" stroke="#997d60" stroke-width="3" stroke-dasharray="4 5"/><ellipse cx="914" cy="109" rx="30" ry="25" fill="#d28a42"/><path d="m901 105 8-6 1 8m17-2-8-6-1 8M900 118h26" stroke="#513349" stroke-width="4"/><text x="625" y="330" font-family="Verdana,sans-serif" font-size="19" font-weight="normal" fill="#46313d">To the night readers</text><text x="625" y="375" font-family="Verdana,sans-serif" font-size="19" font-weight="normal" fill="#46313d">of Lerndorf</text><path d="M625 388h339m-339 47h339m-339 47h339" stroke="#aa8c6b"/><text x="42" y="641" font-family="Verdana,sans-serif" font-size="12" font-weight="normal" fill="#80553b">HALLOWEEN · ENGLISH 8 · ORIGINAL POSTCARD TEXT</text></svg>