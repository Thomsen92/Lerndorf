<svg xmlns="http://www.w3.org/2000/svg" width="512" height="768" viewBox="0 0 512 768" color="#b198c9"><defs><linearGradient id="metal" x2=".8" y2="1"><stop stop-color="#fff0c9"/><stop offset=".22" stop-color="currentColor"/><stop offset=".5" stop-color="#866750"/><stop offset=".7" stop-color="currentColor"/><stop offset="1" stop-color="#493b43"/></linearGradient><linearGradient id="paper" x2=".7" y2="1"><stop stop-color="#f0e2c5"/><stop offset="1" stop-color="#c9b58f"/></linearGradient><linearGradient id="night" x2=".8" y2="1"><stop stop-color="#4b3f58"/><stop offset="1" stop-color="#2b2b33"/></linearGradient><radialGradient id="ruby"><stop stop-color="#ee9a86"/><stop offset=".35" stop-color="#c64b5c"/><stop offset="1" stop-color="#65293c"/></radialGradient></defs><rect width="512" height="768" fill="#342f3d"/><rect x="14" y="14" width="484" height="740" rx="18" fill="url(#paper)" stroke="url(#metal)" stroke-width="7"/>
    <text x="256" y="62" text-anchor="middle" fill="#7c5c4c" font-family="Verdana,sans-serif" font-size="11" font-weight="normal"><tspan x="256" dy="0">THE MIDNIGHT COLLECTION</tspan></text><text x="256" y="121" text-anchor="middle" fill="#493946" font-family="Verdana,sans-serif" font-size="30" font-weight="bold"><tspan x="256" dy="0">Original verse</tspan></text><text x="256" y="163" text-anchor="middle" fill="#785a50" font-family="Verdana,sans-serif" font-size="16" font-weight="normal"><tspan x="256" dy="0">Peter Piper</tspan></text>
    <path d="M61 205h390" stroke="#a17c58"/><text x="256" y="245" text-anchor="middle" fill="#493946" font-family="Verdana,sans-serif" font-size="18" font-weight="normal"><tspan x="256" dy="0">Peter Piper picked a peck of pickled</tspan><tspan x="256" dy="26">peppers,</tspan></text>
    <text x="256" y="413" text-anchor="middle" fill="#493946" font-family="Verdana,sans-serif" font-size="19" font-weight="bold"><tspan x="256" dy="0">Traditional</tspan></text><text x="256" y="444" text-anchor="middle" fill="#785a50" font-family="Verdana,sans-serif" font-size="12" font-weight="normal"><tspan x="256" dy="0">First line</tspan></text>
    <text x="256" y="508" text-anchor="middle" fill="#4b3f46" font-family="Verdana,sans-serif" font-size="16" font-weight="normal"><tspan x="256" dy="0">Repeat the p sound slowly. A peck is an</tspan><tspan x="256" dy="23">old measure.</tspan></text><path d="M61 584h390" stroke="#a17c58"/>
    <text x="256" y="616" text-anchor="middle" fill="#785a50" font-family="Verdana,sans-serif" font-size="15" font-weight="normal"><tspan x="256" dy="0">A traditional tongue twister, recited</tspan><tspan x="256" dy="23">by our skeleton.</tspan></text><text x="256" y="698" text-anchor="middle" fill="#785a50" font-family="Verdana,sans-serif" font-size="10" font-weight="normal"><tspan x="256" dy="0">University of South Florida · Lit2Go</tspan></text><text x="256" y="736" text-anchor="middle" fill="#7c5c4c" font-family="Verdana,sans-serif" font-size="9" font-weight="normal"><tspan x="256" dy="0">Source link in the almanac · original text public domain</tspan></text></svg>