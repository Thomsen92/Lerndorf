  <text x="256" y="62" text-anchor="middle" fill="#7c5c4c" font-family="Verdana,sans-serif" font-size="11" font-weight="normal"><tspan x="256" dy="0">THE MIDNIGHT COLLECTION</tspan></text><text x="256" y="121" text-anchor="middle" fill="#493946" font-family="Verdana,sans-serif" font-size="30" font-weight="bold"><tspan x="256" dy="0">Field notes</tspan></text><text x="256" y="164" text-anchor="middle" fill="#785a50" font-family="Verdana,sans-serif" font-size="16" font-weight="normal"><tspan x="256" dy="0">The Silver Lining</tspan></text>
  <path d="M61 194h390" stroke="#a17c58"/><text x="256" y="252" text-anchor="middle" fill="#4b3f46" font-family="Verdana,sans-serif" font-size="18" font-weight="normal"><tspan x="256" dy="0">A difficult situation may have a</tspan><tspan x="256" dy="28">good side.</tspan></text><text x="256" y="340" text-anchor="middle" fill="#4b3f46" font-family="Verdana,sans-serif" font-size="18" font-weight="normal"><tspan x="256" dy="0">The rain kept us inside.</tspan></text><text x="256" y="400" text-anchor="middle" fill="#4b3f46" font-family="Verdana,sans-serif" font-size="18" font-weight="normal"><tspan x="256" dy="0">We found a new story to read</tspan><tspan x="256" dy="28">together.</tspan></text>
  <path d="M61 574h390" stroke="#a17c58"/><text x="256" y="616" text-anchor="middle" fill="#785a50" font-family="Verdana,sans-serif" font-size="16" font-weight="normal"><tspan x="256" dy="0">A traditional proverb about finding</tspan><tspan x="256" dy="25">hope.</tspan></text>
