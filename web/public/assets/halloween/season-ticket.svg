<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 128" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Season I Halloween ticket</title>
  <desc id="desc">A clean dark purple ticket with a thin golden edge, the words Season I and Halloween, and a crescent moon on the stub.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2650"/>
      <stop offset="1" stop-color="#1b1229"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe2a0"/>
      <stop offset="1" stop-color="#c9924f"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="240" height="128" fill="#fff"/>
      <circle cx="204" cy="58" r="12" fill="#000"/>
    </mask>
  </defs>
  <path d="M18 10H222Q230 10 230 18V48A16 16 0 0 0 230 80V110Q230 118 222 118H18Q10 118 10 110V80A16 16 0 0 0 10 48V18Q10 10 18 10Z" fill="url(#paper)" stroke="url(#gold)" stroke-width="3"/>
  <path d="M176 20V108" stroke="#c9924f" stroke-opacity=".7" stroke-width="1.5" stroke-dasharray="3 5"/>
  <text x="93" y="64" text-anchor="middle" fill="url(#gold)" font-family="Georgia,'Times New Roman',serif" font-weight="bold" font-size="27" letter-spacing="1">SEASON I</text>
  <path d="M58 76H128" stroke="#c9924f" stroke-opacity=".6" stroke-width="1"/>
  <text x="93" y="96" text-anchor="middle" fill="#d9cce6" font-family="Arial,Helvetica,sans-serif" font-size="11" letter-spacing="3.2">HALLOWEEN</text>
  <circle cx="196" cy="64" r="15" fill="url(#gold)" mask="url(#crescent)"/>
</svg>
