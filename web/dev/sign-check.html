<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fast-food sign – preview</title>
    <style>
      html, body { margin: 0; height: 100%; background: #14101c; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; }
      #hud { position: fixed; left: 16px; top: 12px; color: #f3e6d0; font: 14px system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="hud">Fast-food sign on a 3 × 3 pedestal</div>
    <script type="module">
      import * as THREE from 'three';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
      import { loadGlbItem } from '../src/render/glbItems';

      const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1020);
      const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
      camera.position.set(0, 3.4, 7.5);
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 1.6, 0);
      controls.enableDamping = true;

      scene.add(new THREE.HemisphereLight(0xc9b8ff, 0x20182a, 1.5));
      const sun = new THREE.DirectionalLight(0xffe0b0, 2.2);
      sun.position.set(5, 11, 8);
      sun.castShadow = true;
      scene.add(sun);

      const ground = new THREE.Mesh(
        new THREE.CircleGeometry(12, 48),
        new THREE.MeshStandardMaterial({ color: 0x2a2434, roughness: 1 }),
      );
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      const base = new THREE.Mesh(
        new THREE.BoxGeometry(3, 0.2, 3),
        new THREE.MeshStandardMaterial({ color: 0x3a3050, roughness: 0.9 }),
      );
      base.position.y = 0.1;
      base.receiveShadow = true;
      scene.add(base);

      const model = await loadGlbItem('shop_fast_food_sign');
      model.position.y = 0.2;
      scene.add(model);
      const box = new THREE.Box3().setFromObject(model);
      window.__size = { size: box.getSize(new THREE.Vector3()).toArray().map((n) => +n.toFixed(2)), minY: +box.min.y.toFixed(2) };
      window.__ready = true;

      renderer.setAnimationLoop(() => {
        controls.update();
        renderer.render(scene, camera);
      });
      addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });
    </script>
  </body>
</html>
