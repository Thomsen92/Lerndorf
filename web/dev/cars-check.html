<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cars – preview</title>
    <style>
      html, body { margin: 0; height: 100%; background: #14101c; overflow: hidden; }
      canvas { display: block; width: 100%; height: 100%; }
      #hud { position: fixed; left: 16px; top: 12px; color: #f3e6d0; font: 14px system-ui, sans-serif; }
      .label { position: fixed; bottom: 22px; color: #ffd16d; font: 700 13px system-ui, sans-serif; text-shadow: 0 2px 4px #000; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="hud">Cars – Beatall, Toyoyo, Retro Sports Car, Off-Road Rover, Racing GT</div>
    <div class="label" style="left: 4%">Beatall</div>
    <div class="label" style="left: 23%">Toyoyo</div>
    <div class="label" style="left: 42%">Retro Sports Car</div>
    <div class="label" style="left: 61%">Off-Road Rover</div>
    <div class="label" style="left: 81%">Racing GT</div>
    <script type="module">
      import * as THREE from 'three';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
      import { loadGlbItem } from '../src/render/glbItems';

      const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1020);
      const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 120);
      camera.position.set(0, 7.5, 18);
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 0.8, 0);
      controls.enableDamping = true;

      scene.add(new THREE.HemisphereLight(0xc9b8ff, 0x20182a, 1.5));
      const sun = new THREE.DirectionalLight(0xffe0b0, 2.3);
      sun.position.set(5, 11, 8);
      sun.castShadow = true;
      scene.add(sun);

      const ground = new THREE.Mesh(
        new THREE.CircleGeometry(24, 48),
        new THREE.MeshStandardMaterial({ color: 0x2a2434, roughness: 1 }),
      );
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      const pad = new THREE.MeshStandardMaterial({ color: 0x3a3050, roughness: 0.9 });
      const sizes = [];
      const items = [
        ['shop_beatall', -9.6],
        ['shop_toyoyo', -4.8],
        ['shop_delorean', 0],
        ['shop_landyroamer', 4.8],
        ['shop_tristar', 9.6],
      ];
      for (const [id, x] of items) {
        const base = new THREE.Mesh(new THREE.BoxGeometry(4.8, 0.15, 4.8), pad);
        base.position.set(x, 0.075, 0);
        base.receiveShadow = true;
        scene.add(base);
        const model = await loadGlbItem(id);
        model.position.set(x, 0.15, 0);
        scene.add(model);
        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        sizes.push({ id, size: size.toArray().map((n) => +n.toFixed(2)), minY: +box.min.y.toFixed(2) });
      }
      window.__sizes = sizes;
      window.__ready = true;

      renderer.setAnimationLoop(() => {
        controls.update();
        renderer.render(scene, camera);
      });
      addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });
    </script>
  </body>
</html>
