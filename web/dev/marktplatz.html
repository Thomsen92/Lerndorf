<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Season I â€“ Marktplatz</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; overflow: hidden; background: #0a0610; }
      canvas { display: block; width: 100%; height: 100%; }
      #hud {
        position: fixed; inset: 0; pointer-events: none;
        font-family: 'Georgia', 'Times New Roman', serif; color: #f3e6d0;
        background: radial-gradient(120% 90% at 50% 40%, transparent 55%, #05030acc 100%);
      }
      .title { position: absolute; top: 26px; left: 32px; }
      .title small { display: block; letter-spacing: .34em; font-size: 12px; color: #c98b6b; font-family: system-ui, sans-serif; }
      .title h1 { margin: 6px 0 0; font-size: 40px; letter-spacing: .02em; color: #f6d9b0;
        text-shadow: 0 0 22px #ff3b1f88, 0 0 60px #ff2a0f44; }
      .title p { margin: 6px 0 0; font-size: 14px; color: #b9a4b8; font-family: system-ui, sans-serif; }
      .hint { position: absolute; bottom: 22px; left: 32px; font: 13px system-ui, sans-serif; color: #8f7f95; }
      .badge { position: absolute; top: 30px; right: 32px; font: 12px system-ui, sans-serif; letter-spacing: .18em;
        color: #ffb38a; border: 1px solid #ff6a3d55; padding: 7px 12px; border-radius: 999px; background: #1a0d16aa; }
      .vignette { position: absolute; inset: 0; box-shadow: inset 0 0 180px #000a; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="hud">
      <div class="vignette"></div>
      <div class="badge">PROTOTYP · SEASON I</div>
      <div class="title">
        <small>HALLOWEEN</small>
        <h1>Marktplatz</h1>
        <p>Blutmond über Lerndorf</p>
      </div>
      <div class="hint">Ziehen zum Drehen · Scrollen zum Zoomen</div>
    </div>

    <script type="module">
      import * as THREE from 'three';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
      import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

      const canvas = document.getElementById('c');
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.45;
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0b0712);
      scene.fog = new THREE.FogExp2(0x140a16, 0.019);

      const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.1, 400);
      camera.position.set(0, 7.5, 21);
      const controls = new OrbitControls(camera, canvas);
      controls.target.set(0, 3, -2);
      controls.enableDamping = true;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.35;
      controls.minDistance = 8;
      controls.maxDistance = 40;
      controls.maxPolarAngle = Math.PI * 0.49;

      // ---------- lights ----------
      scene.add(new THREE.HemisphereLight(0x7a5a8a, 0x241426, 1.15));
      const moonLight = new THREE.DirectionalLight(0xff6a4a, 2.6);
      moonLight.position.set(-26, 24, -34);
      moonLight.castShadow = true;
      moonLight.shadow.mapSize.set(1024, 1024);
      moonLight.shadow.camera.left = -22;
      moonLight.shadow.camera.right = 22;
      moonLight.shadow.camera.top = 22;
      moonLight.shadow.camera.bottom = -22;
      scene.add(moonLight);
      const rim = new THREE.DirectionalLight(0x6a8bff, 1.1);
      rim.position.set(18, 12, 16);
      scene.add(rim);
      const fill = new THREE.DirectionalLight(0xa07ab0, 0.7);
      fill.position.set(6, 9, 22);
      scene.add(fill);

      // ---------- textures (procedural) ----------
      function cobbleTexture() {
        const s = 512;
        const cv = document.createElement('canvas');
        cv.width = cv.height = s;
        const cx = cv.getContext('2d');
        cx.fillStyle = '#1b1520';
        cx.fillRect(0, 0, s, s);
        for (let i = 0; i < 900; i++) {
          const x = Math.random() * s;
          const y = Math.random() * s;
          const r = 6 + Math.random() * 16;
          const g = 26 + Math.random() * 26;
          cx.fillStyle = `rgb(${g},${g - 4},${g + 6})`;
          cx.beginPath();
          cx.ellipse(x, y, r, r * (0.6 + Math.random() * 0.5), Math.random() * 3, 0, Math.PI * 2);
          cx.fill();
        }
        const t = new THREE.CanvasTexture(cv);
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.repeat.set(6, 6);
        t.colorSpace = THREE.SRGBColorSpace;
        return t;
      }

      function stripeTexture(a, b) {
        const cv = document.createElement('canvas');
        cv.width = 64; cv.height = 64;
        const cx = cv.getContext('2d');
        cx.fillStyle = a; cx.fillRect(0, 0, 64, 64);
        cx.fillStyle = b;
        for (let i = 0; i < 64; i += 16) cx.fillRect(i, 0, 8, 64);
        const t = new THREE.CanvasTexture(cv);
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.repeat.set(3, 1);
        t.colorSpace = THREE.SRGBColorSpace;
        return t;
      }

      function glowTexture() {
        const s = 128;
        const cv = document.createElement('canvas');
        cv.width = cv.height = s;
        const cx = cv.getContext('2d');
        const grd = cx.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
        grd.addColorStop(0, 'rgba(255,90,50,0.9)');
        grd.addColorStop(0.35, 'rgba(200,40,30,0.35)');
        grd.addColorStop(1, 'rgba(120,0,0,0)');
        cx.fillStyle = grd;
        cx.fillRect(0, 0, s, s);
        return new THREE.CanvasTexture(cv);
      }

      // ---------- ground ----------
      const ground = new THREE.Mesh(
        new THREE.CircleGeometry(30, 64),
        new THREE.MeshStandardMaterial({ map: cobbleTexture(), roughness: 1, metalness: 0 }),
      );
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      const plaza = new THREE.Mesh(
        new THREE.CylinderGeometry(10, 10.4, 0.18, 48),
        new THREE.MeshStandardMaterial({ color: 0x2a2230, roughness: 0.95 }),
      );
      plaza.position.y = 0.09;
      plaza.receiveShadow = true;
      scene.add(plaza);

      // ---------- blood moon ----------
      const moon = new THREE.Mesh(
        new THREE.SphereGeometry(5.2, 40, 40),
        new THREE.MeshBasicMaterial({ color: 0xff3a22 }),
      );
      moon.position.set(-18, 17, -38);
      scene.add(moon);
      const halo = new THREE.Sprite(
        new THREE.SpriteMaterial({ map: glowTexture(), color: 0xff4422, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }),
      );
      halo.position.copy(moon.position).add(new THREE.Vector3(0, 0, 3));
      halo.scale.setScalar(72);
      scene.add(halo);

      // ---------- stars ----------
      {
        const n = 500;
        const pos = new Float32Array(n * 3);
        for (let i = 0; i < n; i++) {
          const r = 120 + Math.random() * 80;
          const th = Math.random() * Math.PI * 2;
          const ph = Math.acos(0.15 + Math.random() * 0.85);
          pos[i * 3] = Math.sin(ph) * Math.cos(th) * r;
          pos[i * 3 + 1] = Math.cos(ph) * r * 0.75 + 10;
          pos[i * 3 + 2] = Math.sin(ph) * Math.sin(th) * r;
        }
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        scene.add(new THREE.Points(geo, new THREE.PointsMaterial({ color: 0xffd9c0, size: 0.5, transparent: true, opacity: 0.65 })));
      }

      // ---------- helpers ----------
      const M = (color, opts = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.9, ...opts });
      function box(w, h, d, color, x = 0, y = 0, z = 0, opts = {}) {
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), M(color, opts));
        m.position.set(x, y, z);
        m.castShadow = true;
        m.receiveShadow = true;
        return m;
      }

      // ---------- market stalls ----------
      const cloth = (a, b) => new THREE.MeshStandardMaterial({ map: stripeTexture(a, b), roughness: 0.95, side: THREE.DoubleSide });
      function stall(x, z, rotY, colors) {
        const g = new THREE.Group();
        const wood = 0x4a3324;
        const posts = [[-1.5, -1.1], [1.5, -1.1], [-1.5, 1.1], [1.5, 1.1]];
        for (const [px, pz] of posts) g.add(box(0.16, 2.6, 0.16, wood, px, 1.3, pz));
        g.add(box(3.4, 0.14, 0.9, 0x3a2a1e, 0, 1.0, 1.05));
        const roofL = new THREE.Mesh(new THREE.BoxGeometry(3.8, 0.08, 1.5), cloth(colors[0], colors[1]));
        roofL.position.set(0, 2.95, -0.55);
        roofL.rotation.x = 0.42;
        roofL.castShadow = true;
        const roofR = roofL.clone();
        roofR.position.z = 0.55;
        roofR.rotation.x = -0.42;
        g.add(roofL, roofR);
        // goods
        for (let i = 0; i < 4; i++) {
          const p = new THREE.Mesh(new THREE.SphereGeometry(0.22 + Math.random() * 0.08, 12, 10), M(0xd96a1f));
          p.scale.y = 0.8;
          p.position.set(-1.1 + i * 0.72, 1.18, 1.0);
          p.castShadow = true;
          g.add(p);
        }
        const candle = box(0.06, 0.3, 0.06, 0xe8dfc8, 1.2, 1.2, 0.75, { emissive: 0xffb060, emissiveIntensity: 0.4 });
        g.add(candle);
        g.position.set(x, 0, z);
        g.rotation.y = rotY;
        scene.add(g);
        return g;
      }
      stall(-8, -5, 0.5, ['#7a2a32', '#241016']);
      stall(8, -5, -0.5, ['#3a2a5a', '#171024']);
      stall(-8, 6, 2.4, ['#5a3a1a', '#1c1408']);
      stall(8, 6, -2.4, ['#7a2a32', '#241016']);

      // ---------- lanterns ----------
      const lanterns = [];
      function lantern(x, z) {
        const g = new THREE.Group();
        g.add(box(0.16, 2.9, 0.16, 0x2e2218, 0, 1.45, 0));
        const cage = box(0.42, 0.5, 0.42, 0x1c1410, 0, 3.05, 0);
        g.add(cage);
        const glass = new THREE.Mesh(
          new THREE.BoxGeometry(0.3, 0.34, 0.3),
          new THREE.MeshStandardMaterial({ color: 0xffb060, emissive: 0xff9a3c, emissiveIntensity: 2.4 }),
        );
        glass.position.y = 3.02;
        g.add(glass);
        const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture(), color: 0xffa050, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
        glow.position.set(0, 3.05, 0);
        glow.scale.setScalar(2.4);
        g.add(glow);
        const light = new THREE.PointLight(0xff9a44, 42, 15, 2);
        light.position.y = 3.0;
        g.add(light);
        g.position.set(x, 0, z);
        scene.add(g);
        lanterns.push({ light, glass, phase: Math.random() * 10 });
      }
      const ring = 8;
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2 + 0.3;
        lantern(Math.cos(a) * ring, Math.sin(a) * ring);
      }

      // ---------- procedural zombies ----------
      const zombies = [];
      function makeZombie() {
        const g = new THREE.Group();
        const skin = M(0x7f9a63, { roughness: 1 });
        const cloth = M(0x323846);
        const torso = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.72, 0.34), cloth);
        torso.position.y = 1.12;
        torso.castShadow = true;
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.34, 0.32), skin);
        head.position.y = 1.62;
        head.castShadow = true;
        const eyeMat = new THREE.MeshStandardMaterial({ color: 0xff2a10, emissive: 0xff2a10, emissiveIntensity: 3 });
        const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.035, 8, 8), eyeMat);
        eyeL.position.set(-0.08, 1.65, 0.17);
        const eyeR = eyeL.clone();
        eyeR.position.x = 0.08;
        const armL = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.14, 0.62), skin);
        armL.position.set(-0.38, 1.32, 0.28);
        const armR = armL.clone();
        armR.position.x = 0.38;
        const legL = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.66, 0.2), cloth);
        legL.position.set(-0.16, 0.42, 0);
        const legR = legL.clone();
        legR.position.x = 0.16;
        g.add(torso, head, eyeL, eyeR, armL, armR, legL, legR);
        const angle = Math.random() * Math.PI * 2;
        const radius = 3 + Math.random() * 4;
        g.scale.setScalar(1.3);
        g.userData = { angle, radius, speed: 0.15 + Math.random() * 0.18, phase: Math.random() * 10, legL, legR, armL, armR };
        scene.add(g);
        zombies.push(g);
      }
      for (let i = 0; i < 5; i++) makeZombie();

      // ---------- bats ----------
      const bats = [];
      for (let i = 0; i < 9; i++) {
        const g = new THREE.Group();
        const body = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.5, 5), M(0x0b0a10));
        body.rotation.x = Math.PI / 2;
        const wingGeo = new THREE.PlaneGeometry(0.6, 0.28);
        const wingMat = new THREE.MeshBasicMaterial({ color: 0x0b0a10, side: THREE.DoubleSide });
        const wl = new THREE.Mesh(wingGeo, wingMat);
        wl.position.x = -0.4;
        const wr = wl.clone();
        wr.position.x = 0.4;
        g.add(body, wl, wr);
        g.userData = { wl, wr, a: Math.random() * Math.PI * 2, r: 12 + Math.random() * 10, h: 9 + Math.random() * 6, speed: 0.2 + Math.random() * 0.2 };
        scene.add(g);
        bats.push(g);
      }

      // ---------- embers ----------
      const emberCount = 260;
      const emberPos = new Float32Array(emberCount * 3);
      const emberSeed = [];
      for (let i = 0; i < emberCount; i++) {
        const a = Math.random() * Math.PI * 2;
        const r = Math.random() * 12;
        emberPos[i * 3] = Math.cos(a) * r;
        emberPos[i * 3 + 1] = Math.random() * 8;
        emberPos[i * 3 + 2] = Math.sin(a) * r;
        emberSeed.push({ speed: 0.2 + Math.random() * 0.5, a, r });
      }
      const emberGeo = new THREE.BufferGeometry();
      emberGeo.setAttribute('position', new THREE.BufferAttribute(emberPos, 3));
      const embers = new THREE.Points(
        emberGeo,
        new THREE.PointsMaterial({ color: 0xff8a3a, size: 0.09, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false }),
      );
      scene.add(embers);

      // ---------- GLB models ----------
      const loader = new GLTFLoader();
      loader.setMeshoptDecoder(MeshoptDecoder);
      const base = `${import.meta.env.BASE_URL}assets/season1/`;
      function place(file, x, z, scale = 1, rotY = 0, y = 0) {
        loader.load(base + file, (gltf) => {
          const root = gltf.scene;
          root.name = file;
          root.traverse((o) => {
            if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; }
          });
          root.scale.setScalar(scale);
          root.position.set(x, y, z);
          root.rotation.y = rotY;
          scene.add(root);
        }, undefined, (err) => console.error('LOAD_FAIL', file, err));
      }
      place('warlock.glb', 0, 0.6, 0.95, 0.4, 0.18);
      place('house-horror.glb', -1, -15.5, 1.0, 0.15);
      const houseLight = new THREE.PointLight(0xff4a22, 30, 22, 2);
      houseLight.position.set(-1, 3.5, -13);
      scene.add(houseLight);
      place('graveyard-corner.glb', -5.5, -2.5, 1.15, 0.3);
      place('graveyard-corner.glb', 6.2, -1.8, 0.95, 2.4);
      place('graveyard-corner.glb', -6.4, 3.4, 0.8, 4.1);
      place('pumpkin-patch.glb', 4.6, 3.2, 1.05, 1.1);
      place('pumpkin-patch.glb', -4.2, 4.6, 0.85, 3.2);
      place('kit-jack-o-lantern.glb', -2.4, 2.3, 1.1, 0.6);
      place('kit-jack-o-lantern.glb', 2.6, 1.4, 0.9, 2.2);
      place('kit-jack-o-lantern.glb', 3.4, -2.6, 1.0, 4.0);
      place('kit-monster-plant.glb', -11.4, -8.6, 1.7, 0.2);
      place('kit-monster-plant.glb', 11.6, -7.2, 1.4, 1.1);
      place('ghost-kitty.glb', 2.2, -1.6, 0.9, 0.8);

      // ---------- animation ----------
      const spotW = new THREE.SpotLight(0xffb070, 260, 40, 0.55, 0.6, 1.4);
      spotW.position.set(0, 14, 7);
      spotW.target.position.set(0, 1.6, 0);
      scene.add(spotW, spotW.target);
      const spotH = new THREE.SpotLight(0xff5a30, 320, 50, 0.7, 0.7, 1.2);
      spotH.position.set(-1, 12, -4);
      spotH.target.position.set(-1, 3, -15.5);
      scene.add(spotH, spotH.target);
      const clock = new THREE.Clock();
      function animate() {
        const dt = Math.min(clock.getDelta(), 0.05);
        const t = clock.elapsedTime;

        for (const l of lanterns) {
          const f = 0.82 + 0.12 * Math.sin(t * 9 + l.phase) + 0.06 * Math.sin(t * 23 + l.phase * 2);
          l.light.intensity = 42 * f;
          l.glass.material.emissiveIntensity = 2.2 * f;
        }

        for (const z of zombies) {
          const d = z.userData;
          d.angle += d.speed * dt;
          const x = Math.cos(d.angle) * d.radius;
          const zz = Math.sin(d.angle) * d.radius;
          z.position.set(x, 0, zz);
          z.rotation.y = -d.angle + Math.PI / 2;
          const step = Math.sin(t * 5 + d.phase);
          d.legL.rotation.x = step * 0.55;
          d.legR.rotation.x = -step * 0.55;
          d.armL.rotation.x = 0.1 + Math.sin(t * 2 + d.phase) * 0.08;
          d.armR.rotation.x = 0.1 - Math.sin(t * 2 + d.phase) * 0.08;
          z.position.y = Math.abs(Math.sin(t * 5 + d.phase)) * 0.04;
          z.rotation.z = Math.sin(t * 2.5 + d.phase) * 0.05;
        }

        for (const b of bats) {
          const d = b.userData;
          d.a += d.speed * dt;
          b.position.set(Math.cos(d.a) * d.r, d.h + Math.sin(t * 1.5 + d.a) * 0.6, Math.sin(d.a) * d.r);
          b.rotation.y = -d.a;
          d.wl.rotation.z = Math.sin(t * 14 + d.a) * 0.7;
          d.wr.rotation.z = -Math.sin(t * 14 + d.a) * 0.7;
        }

        const pos = embers.geometry.attributes.position;
        for (let i = 0; i < emberCount; i++) {
          let y = pos.getY(i) + emberSeed[i].speed * dt;
          if (y > 9) y = 0;
          pos.setY(i, y);
          pos.setX(i, emberSeed[i].r * Math.cos(emberSeed[i].a + t * 0.05));
          pos.setZ(i, emberSeed[i].r * Math.sin(emberSeed[i].a + t * 0.05));
        }
        pos.needsUpdate = true;

        halo.material.opacity = 0.85 + Math.sin(t * 0.8) * 0.1;

        controls.update();
        renderer.render(scene, camera);
      }
      renderer.setAnimationLoop(animate);
      window.__debug = () => {
        const out = [];
        scene.traverse((o) => {
          if (o.name && o.name.endsWith('.glb')) {
            const b = new THREE.Box3().setFromObject(o);
            const s = b.getSize(new THREE.Vector3());
            out.push({ name: o.name, pos: o.position.toArray().map((n) => +n.toFixed(2)), size: s.toArray().map((n) => +n.toFixed(2)), visible: o.visible });
          }
        });
        return out;
      };

      addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });
    </script>
  </body>
</html>
