<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Halloween-Welt · lokale Abnahme</title>
    <link rel="icon" href="data:," />
    <style>
      body {
        margin: 0;
        background: #2d3a67;
        font:
          14px Arial,
          sans-serif;
        color: #fff1d7;
      }
      canvas {
        display: block;
      }
      nav {
        position: fixed;
        z-index: 10;
        top: 14px;
        left: 14px;
        right: 14px;
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        background: #302a3de8;
        padding: 10px;
        border: 1px solid #d6a34f77;
        border-radius: 12px;
      }
      button {
        min-height: 44px;
        padding: 8px 14px;
        border: 1px solid #b89966;
        border-radius: 8px;
        background: #514463;
        color: #f5e9ce;
        cursor: pointer;
      }
      button[aria-pressed='true'] {
        background: #d6a34f;
        color: #302a3d;
      }
      small {
        margin-left: auto;
      }
      #stats {
        position: fixed;
        bottom: 12px;
        left: 14px;
        z-index: 10;
        padding: 8px 12px;
        background: #302a3ddd;
        border-radius: 8px;
        font-size: 11px;
        pointer-events: none;
      }
      @media (max-width: 650px) {
        nav {
          font-size: 11px;
          padding: 7px;
          gap: 5px;
        }
        nav strong {
          width: 100%;
        }
        button {
          padding: 6px 9px;
        }
        small {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <nav aria-label="Lokale Weltvorschau">
      <strong>Season I · dieselbe Karte</strong
      ><button data-theme="normal" aria-pressed="false">Normal</button
      ><button data-theme="halloween" aria-pressed="true">Halloween</button
      ><button data-view="marketplace">Marktplatz</button><button data-view="overview">Dorf</button
      ><button data-view="plot">Grundstück</button><button data-view="horizon">Blutmond</button
      ><small>Lokale Vorschau · Lehrer-Schalter im Spiel unter Dorf &amp; Regeln</small>
    </nav>
    <p id="stats" role="status">Lade die Karte …</p>
    <script type="module">
      const params = new URLSearchParams(location.search);
      if (!params.has('theme')) params.set('theme', 'halloween');
      if (params.get('static') === '1') {
        params.delete('interactive');
        params.set('responsive', '1');
      } else params.set('interactive', '1');
      history.replaceState(null, '', '?' + params);
      await import('./galerie.ts');
      const wait = setInterval(() => {
        if (!window.galerie?.ready) return;
        clearInterval(wait);
        const stats = document.getElementById('stats');
        // Buttons always mirror the theme that is really shown (also for ?theme=normal).
        function syncButtons() {
          const active = window.galerie.theme();
          document
            .querySelectorAll('[data-theme]')
            .forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.theme === active)));
        }
        // Count after the next drawn frame, otherwise the numbers lag one view behind.
        const nextFrame = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
        function report() {
          const s = window.galerie.appearanceCost();
          stats.textContent = `${window.galerie.theme()} · ${s.calls} Draw Calls · ${s.triangles.toLocaleString('de-DE')} Dreiecke · Ziehen zum Drehen / Pinch zum Zoomen`;
        }
        document.querySelectorAll('[data-theme]').forEach((b) =>
          b.addEventListener('click', async () => {
            await window.galerie.setTheme(b.dataset.theme);
            syncButtons();
            await nextFrame();
            report();
          }),
        );
        document.querySelectorAll('[data-view]').forEach((b) =>
          b.addEventListener('click', async () => {
            window.galerie.setView(b.dataset.view);
            await nextFrame();
            report();
          }),
        );
        syncButtons();
        report();
      }, 100);
    </script>
  </body>
</html>
