<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Season models – loader check (A1)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #14101c; }
      canvas { display: block; width: 100%; height: 100%; }
      #hud { position: fixed; left: 16px; top: 12px; color: #f3e6d0; font: 14px system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="hud">Season models – normalised on 3 × 3 pedestals</div>
    <script type="module">
      import * as THREE from 'three';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
      import { loadGlbItem } from '../src/render/glbItems';
      import { passScene } from '../src/render/passScenes';

      const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x14101c);
      const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
      camera.position.set(10, 8, 16);
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 1.2, 2.5);
      controls.enableDamping = true;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.25;

      scene.add(new THREE.HemisphereLight(0xc9b8ff, 0x20182a, 1.1));
      const sun = new THREE.DirectionalLight(0xffe0b0, 2.2);
      sun.position.set(8, 12, 6);
      sun.castShadow = true;
      scene.add(sun);

      const ground = new THREE.Mesh(
        new THREE.CircleGeometry(14, 48),
        new THREE.MeshStandardMaterial({ color: 0x2a2434, roughness: 1 }),
      );
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      const ids = [
        'season_warlock',
        'season_house_horror',
        'season_dodge',
        'season_pumpkin_patch',
        'season_ghost_kitty',
        'season_bat',
        'shop_cabin',
        'shop_president_car',
      ];
      const positions = [
        [-5, -1], [0, -4], [5, -1], [-5, 3], [0, 2], [5, 4], [-9, -5], [9, -6],
      ];
      const sizes = [];
      for (let i = 0; i < ids.length; i++) {
        const model = await loadGlbItem(ids[i]);
        model.position.set(positions[i][0], 0, positions[i][1]);
        scene.add(model);
        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        sizes.push({ id: ids[i], size: size.toArray().map((n) => +n.toFixed(2)), minY: +box.min.y.toFixed(2) });
      }
      window.__sizes = sizes;

      // Pass scenes (A3): composed Kenney scenes on their own pedestals.
      const scenes = ['scene_pumpkin_bed', 'scene_graveyard_gate', 'scene_vampire_coffin'];
      const sceneSpots = [[-3, 5], [0.5, 5.5], [4, 5]];
      const sceneGroups = [];
      for (let i = 0; i < scenes.length; i++) {
        const model = passScene(scenes[i]);
        model.position.set(sceneSpots[i][0], 0, sceneSpots[i][1]);
        scene.add(model);
        sceneGroups.push(model);
      }
      setTimeout(() => {
        window.__sceneSizes = sceneGroups.map((g, i) => {
          const b = new THREE.Box3().setFromObject(g);
          const s = b.getSize(new THREE.Vector3());
          return { id: scenes[i], size: s.toArray().map((n) => +n.toFixed(2)), minY: +b.min.y.toFixed(2) };
        });
      }, 2000);
      window.__ready = true;

      renderer.setAnimationLoop(() => {
        controls.update();
        renderer.render(scene, camera);
      });
      addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });
    </script>
  </body>
</html>
